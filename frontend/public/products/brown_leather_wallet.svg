<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="396" height="376" x="2" y="2" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Grid accent lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  <line x1="0" y1="310" x2="400" y2="310" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- Vector shape -->
  <g filter="url(#glow)">
    <rect x="100" y="130" width="200" height="140" rx="16" fill="#78350f" stroke="#ffffff" stroke-width="4"/>
    <path d="M100 180 L300 180" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4"/>
    <rect x="240" y="185" width="45" height="35" rx="6" fill="#eab308" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Top Badge -->
  <rect x="20" y="20" width="100" height="24" rx="12" fill="#5dffaa" fill-opacity="0.15" stroke="#5dffaa" stroke-width="1.5" />
  <text x="70" y="36" font-family="monospace" font-size="11" font-weight="bold" fill="#5dffaa" text-anchor="middle" letter-spacing="1">ACCESSORIES</text>

  <!-- Bottom Title Banner -->
  <rect x="16" y="315" width="368" height="48" rx="8" fill="#040a07" fill-opacity="0.8" stroke="#2a4035" stroke-width="1" />
  <text x="30" y="337" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Brown Leather Wallet</text>
  <text x="30" y="353" font-family="monospace" font-size="10" fill="#a8c8b4">Brown Bifold Leather</text>
</svg>