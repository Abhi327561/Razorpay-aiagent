<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131e" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="396" height="376" x="2" y="2" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Grid accent lines -->
  <line x1="0" y1="60" x2="400" y2="60" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  <line x1="0" y1="310" x2="400" y2="310" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- Vector shape -->
  <g filter="url(#glow)">
    <path d="M120 100 L280 100 L270 320 L210 320 L200 180 L190 180 L180 320 L120 320 Z" fill="#b45309" stroke="#ffffff" stroke-width="4"/>
    <line x1="120" y1="140" x2="280" y2="140" stroke="#ffffff" stroke-width="3"/>
    <line x1="200" y1="100" x2="200" y2="170" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Top Badge -->
  <rect x="20" y="20" width="100" height="24" rx="12" fill="#5dffaa" fill-opacity="0.15" stroke="#5dffaa" stroke-width="1.5" />
  <text x="70" y="36" font-family="monospace" font-size="11" font-weight="bold" fill="#5dffaa" text-anchor="middle" letter-spacing="1">BOTTOMWEAR</text>

  <!-- Bottom Title Banner -->
  <rect x="16" y="315" width="368" height="48" rx="8" fill="#040a07" fill-opacity="0.8" stroke="#2a4035" stroke-width="1" />
  <text x="30" y="337" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Khaki Cargo Pants</text>
  <text x="30" y="353" font-family="monospace" font-size="10" fill="#a8c8b4">Utility Khaki Twill</text>
</svg>